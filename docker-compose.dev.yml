# docker-compose.dev.yml — Stack de desarrollo local iWana neXt
# Servicios: PostgreSQL 18, Redis 8, pgBouncer, MinIO, Nginx, Adminer
# Uso: docker compose -f docker-compose.dev.yml up -d

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 18 — Base de datos principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: iwana_postgres_dev
    environment:
      POSTGRES_USER: iwana
      POSTGRES_PASSWORD: Iwana102+
      POSTGRES_DB: dbiw
    ports:
      - '5433:5432'
    volumes:
      - iwana_postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U iwana -d dbiw']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis 8 — Cache y colas BullMQ
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: iwana_redis_dev
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '6380:6379'
    volumes:
      - iwana_redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Migrator — Ejecuta migraciones de base de datos
  # ---------------------------------------------------------------------------
  migrator:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.migrator
    container_name: iwana_migrator_dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: iwana
      DB_PASSWORD: Iwana102+
      DB_NAME: dbiw
    command: ['node', 'dist/cli/tenant-migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # pgBouncer — Connection pooling para PostgreSQL
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: iwana_pgbouncer_dev
    environment:
      DB_USER: iwana
      DB_PASSWORD: Iwana102+
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dbiw
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - '6433:6432'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO — Almacenamiento de objetos (S3-compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: iwana_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9002:9000' # API S3
      - '9003:9001' # Consola web
    volumes:
      - iwana_minio_data_dev:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx — Proxy inverso de desarrollo
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: iwana_nginx_dev
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Adminer — GUI para PostgreSQL (solo desarrollo)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: iwana_adminer_dev
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Worker — BullMQ processor para provisioning de tenants
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: iwana_worker_dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: iwana
      DB_PASSWORD: Iwana102+
      DB_NAME: dbiw
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

# ---------------------------------------------------------------------------
# Volúmenes nombrados
# ---------------------------------------------------------------------------
volumes:
  iwana_postgres_data_dev:
    name: iwana_postgres_data_dev
  iwana_redis_data_dev:
    name: iwana_redis_data_dev
  iwana_minio_data_dev:
    name: iwana_minio_data_dev
