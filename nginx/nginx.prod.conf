# nginx/nginx.prod.conf — Proxy inverso de producción iWana neXt
# Puerto externo configurado en docker-compose.yml via APP_PORT (default 8080)
#
# Routing:
#   /health      → api:3000/api/v1/health   (conveniencia)
#   /api/v1/*    → api:3000/api/v1/*        (NestJS — preserva path completo)
#   /*           → web:3001/*               (Next.js App Router)

upstream api {
    server api:3000;
    keepalive 32;
}

upstream web {
    server web:3001;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Tamaño máximo del body (para uploads futuros de documentos)
    client_max_body_size 10M;

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health check (acceso directo sin /api/v1 para conveniencia de Docker) ──
    location = /health {
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── API NestJS — /api/* → api:3000 (preserva path completo con /api/v1/) ──
    # Sin trailing slash en proxy_pass: Nginx pasa el path completo al upstream.
    # Ej: GET /api/v1/tenants → http://api:3000/api/v1/tenants
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # Reenviar cookies al cliente (refresh token httpOnly del API)
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Web Next.js — todo lo demás → web:3001 ────────────────────────────────
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
