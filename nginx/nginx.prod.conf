# nginx/nginx.prod.conf — Proxy inverso de producción iWana neXt (TLS)
# ============================================================================
# Routing:
#   /health      → api:3000/api/v1/health   (conveniencia)
#   /api/v1/*    → api:3000/api/v1/*        (NestJS — preserva path completo)
#   https://portal.REPLACE_ME_PRODUCTION_DOMAIN/* → portal:3002/*
#   /*           → web:3001/*               (Next.js App Router)
#
# SSL:
#   Certificados: /etc/nginx/tls/fullchain.pem + privkey.pem (CA aprobada)
#   Generación:   pwsh scripts/generate-certs.ps1  (staging / PoC)
#   Producción:   certificado firmado por CA (Let's Encrypt / corporativo)
# ============================================================================

# No revelar la versión de nginx en la cabecera Server ni en las páginas de error.
server_tokens off;

# `Connection: upgrade` se fijaba de forma incondicional en todos los locations,
# también en peticiones que no son WebSocket. Este map lo condiciona a que el
# cliente haya pedido realmente un upgrade y permite reutilizar keepalive en el
# resto, que es el patrón que documenta nginx para proxy de WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server api-prod:3000;
    keepalive 32;
}

upstream web {
    server web-prod:3001;
    keepalive 16;
}

upstream portal {
    server portal-prod:3002;
    keepalive 16;
}

# ── Redirección HTTP → HTTPS (301 Moved Permanently) ──────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Servidor HTTPS (TLS) ──────────────────────────────────────────────────
server {
    # `listen ... http2` está deprecado desde nginx 1.25.1 y emite un warning en
    # cada arranque; la directiva `http2` es la forma vigente.
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # ── Certificados SSL ──────────────────────────────────────────────────
    # El operador debe montar el certificado emitido por la CA en ./secrets.
    # No se incluye un certificado de ejemplo ni se fija aquí el dominio real.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # ── Protocolos y cifrado ──────────────────────────────────────────────
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Tamaño máximo del body (para uploads futuros de documentos) ──────
    client_max_body_size 10M;

    # ── Headers de seguridad ──────────────────────────────────────────────
    # La CSP NO se duplica aquí (orden de AI-EM-ARCH, C-8): la emiten las apps
    # vía `async headers()` en apps/web/next.config.ts y apps/portal/next.config.ts
    # en sus respuestas HTML, y este proxy la pasa al cliente intacta (no hay
    # proxy_hide_header ni módulo headers-more). NO añadir Content-Security-Policy
    # en este archivo: dos cabeceras CSP en la misma respuesta dejan que el
    # navegador aplique la más permisiva. Verificado por AI-PLAT-OPS 2026-08-09.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ninguna superficie de iWana neXt usa estas APIs del navegador.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS — valor de PREFLIGHT (R3.5, runbook §8.5/8.6): sin dominio productivo
    # ni CA reconocida emitida no se puede prometer un año de HSTS. RFC 6797
    # §6.1.2 recomienda max-age corto (300 s = 5 min) mientras se prueba. SUBIR a
    # `max-age=31536000; includeSubDomains` únicamente tras verificar el primer
    # handshake TLS con la CA aprobada (runbook §8.3) — nunca antes.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    # ── Health check (acceso directo sin /api/v1 para conveniencia de Docker)
    location = /health {
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── API NestJS — /api/* → api:3000 (preserva path completo con /api/v1/)
    # Sin trailing slash en proxy_pass: Nginx pasa el path completo al upstream.
    # Ej: GET /api/v1/tenants → http://api:3000/api/v1/tenants
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Reenviar cookies al cliente sin transformarlas. Cubre las cookies de
        # sesion emitidas por el API: refresh (httpOnly, path /api/v1/auth) y
        # access por audiencia (webAccessToken / portalAccessToken, path /).
        # Verificado por AI-PLAT-OPS 2026-08-09 (ADR-081 C-5).
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Web Next.js — todo lo demás → web:3001
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# Portal de tenants. Se mantiene como virtual host separado para que Next.js
# conserve su basePath raíz y sus assets /_next/*; el hostname es un placeholder
# deliberado hasta que el CTO defina el dominio y la CA de producción.
server {
    listen 443 ssl;
    http2 on;
    server_name portal.REPLACE_ME_PRODUCTION_DOMAIN;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;
    # CSP: ver nota del vhost principal — la emiten las apps, no se duplica aquí.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ninguna superficie de iWana neXt usa estas APIs del navegador.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS — mismo valor de preflight que el vhost principal (max-age=300).
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    location = /health {
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Reenviar cookies al cliente sin transformarlas. Mismo criterio que el
        # vhost principal: cubre refresh y access por audiencia (ADR-081 C-5).
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
