# nginx/nginx.prod.conf — Proxy inverso de producción iWana neXt (TLS)
# ============================================================================
# Routing:
#   /health      → api:3000/api/v1/health   (conveniencia)
#   /api/v1/*    → api:3000/api/v1/*        (NestJS — preserva path completo)
#   https://portal.REPLACE_ME_PRODUCTION_DOMAIN/* → portal:3002/*
#   /*           → web:3001/*               (Next.js App Router)
#
# SSL:
#   Certificados: /etc/nginx/tls/fullchain.pem + privkey.pem (CA aprobada)
#   Generación:   pwsh scripts/generate-certs.ps1  (staging / PoC)
#   Producción:   certificado firmado por CA (Let's Encrypt / corporativo)
# ============================================================================

# No revelar la versión de nginx en la cabecera Server ni en las páginas de error.
server_tokens off;

# `Connection: upgrade` se fijaba de forma incondicional en todos los locations,
# también en peticiones que no son WebSocket. Este map lo condiciona a que el
# cliente haya pedido realmente un upgrade y permite reutilizar keepalive en el
# resto, que es el patrón que documenta nginx para proxy de WebSockets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# H-2 (Ola 2 web-dashboard): /health es público y sin autenticación. Se limita
# por IP de cliente para que no sirva como sonda barata contra Postgres y Redis.
# 1 r/s sostenido con ráfaga corta absorbe monitores y balanceadores; el exceso
# recibe 429 en lugar del 503 por defecto, que se confundiría con «degradado».
limit_req_zone $binary_remote_addr zone=health_per_ip:1m rate=1r/s;

# Al recrear un contenedor cambia su IP: sin `resolve`, nginx conserva la del arranque y responde
# 502 (2026-11-24). `resolve` exige `zone` y nginx >= 1.27.3. 127.0.0.11 es el DNS de Docker.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream api {
    zone api 64k;
    server api-prod:3000 resolve;
    keepalive 32;
}

upstream web {
    zone web 64k;
    server web-prod:3001 resolve;
    keepalive 16;
}

upstream portal {
    zone portal 64k;
    server portal-prod:3002 resolve;
    keepalive 16;
}

# MinIO, solo para descargar por enlace firmado (D2, adjuntos MOD09). nginx lo alcanza por la
# red `storage-edge`, que comparte únicamente con MinIO: sigue sin resolver postgres ni redis.
upstream storage {
    zone storage 64k;
    server minio:9000 resolve;
    keepalive 16;
}

# ── Redirección HTTP → HTTPS (301 Moved Permanently) ──────────────────────
server {
    listen 80 default_server;
    server_name _;
    # `$host` y no un nombre fijo: un solo archivo sirve el acceso por IP de la LAN y los
    # dominios aún sin aprobar (ADR-095); solo redirige al mismo host que el cliente pidió.
    return 301 https://$host$request_uri;
}

# ── Servidor HTTPS (TLS) ──────────────────────────────────────────────────
server {
    # `listen ... http2` está deprecado desde nginx 1.25.1 y emite un warning en
    # cada arranque; la directiva `http2` es la forma vigente.
    listen 443 ssl default_server;
    http2 on;
    server_name consola.REPLACE_ME_PRODUCTION_DOMAIN _;

    # Consola de plataforma: todo el vhost, también nombres desconocidos e IP directa, solo desde
    # la VPN o IP autorizadas (spec 2026-11-25 §5.1). El
    # `deny all` de aquí cierra aunque la lista llegue vacía.
    include /etc/nginx/console/allow.conf;
    deny all;

    # ── Certificados SSL ──────────────────────────────────────────────────
    # El operador debe montar el certificado emitido por la CA en ./secrets.
    # No se incluye un certificado de ejemplo ni se fija aquí el dominio real.
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    # ── Protocolos y cifrado ──────────────────────────────────────────────
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Tamaño máximo del body (para uploads futuros de documentos) ──────
    client_max_body_size 10M;

    # ── Headers de seguridad ──────────────────────────────────────────────
    # La CSP NO se duplica aquí (orden de AI-EM-ARCH, C-8): la emiten las apps
    # vía `async headers()` en apps/web/next.config.ts y apps/portal/next.config.ts
    # en sus respuestas HTML, y este proxy la pasa al cliente intacta (no hay
    # proxy_hide_header ni módulo headers-more). NO añadir Content-Security-Policy
    # en este archivo: dos cabeceras CSP en la misma respuesta dejan que el
    # navegador aplique la más permisiva. Verificado por AI-PLAT-OPS 2026-08-09.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ninguna superficie de iWana neXt usa estas APIs del navegador.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS — valor de PREFLIGHT (R3.5, runbook §8.5/8.6): sin dominio productivo
    # ni CA reconocida emitida no se puede prometer un año de HSTS. RFC 6797
    # §6.1.2 recomienda max-age corto (300 s = 5 min) mientras se prueba. SUBIR a
    # `max-age=31536000; includeSubDomains` únicamente tras verificar el primer
    # handshake TLS con la CA aprobada (runbook §8.3) — nunca antes.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    # ── Health check (acceso directo sin /api/v1 para conveniencia de Docker)
    location = /health {
        limit_req zone=health_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface console;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── API NestJS — /api/* → api:3000 (preserva path completo con /api/v1/)
    # Sin trailing slash en proxy_pass: Nginx pasa el path completo al upstream.
    # Ej: GET /api/v1/tenants → http://api:3000/api/v1/tenants
    # ── Subida de lotes de importación UISP (ADR-110): ZIP por cliente de hasta 100 MB y lote de
    # hasta 200 MB (MIGRATION_IMPORT_LIMITS.maxBatchBytes; 210M deja margen al multipart y la API
    # responde su propio error). Solo esta ruta exacta amplía el cuerpo;
    # el resto del vhost conserva 10M. Mismas cabeceras que /api/.
    location = /api/v1/migration/batches {
        client_max_body_size 210M;
        proxy_request_buffering off;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface console;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # ── Comentario de ticket con adjuntos (MOD09, spec 2026-11-16 §2.5): multipart de hasta 10
    # archivos con un video de hasta 100 MB; la API valida el Content-Length contra 110 MiB
    # (TICKET_COMMENT_ATTACHMENTS_REQUEST_MAX_BYTES) antes de leer el cuerpo. Solo esta ruta, con el
    # id del ticket acotado a UUID, amplía el cuerpo; el resto del vhost conserva 10M. Mismo patrón
    # que la subida de lotes UISP: cuerpo en streaming al API (sin búfer en disco del proxy) y
    # timeouts largos para técnicos con red móvil lenta.
    location ~ "^/api/v1/assurance/tickets/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/comments/with-attachments$" {
        client_max_body_size 110M;
        proxy_request_buffering off;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface console;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # H-2: la consola y los clientes llaman a /api/v1/health, no a /health.
    # Misma zona que /health; resto idéntico a `location /api/`.
    location = /api/v1/health {
        limit_req zone=health_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface console;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface console;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Reenviar cookies al cliente sin transformarlas. Cubre las cookies de
        # sesion emitidas por el API: refresh (httpOnly, path /api/v1/auth) y
        # access por audiencia (webAccessToken / portalAccessToken, path /).
        # Verificado por AI-PLAT-OPS 2026-08-09 (ADR-081 C-5).
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Web Next.js — todo lo demás → web:3001
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface console;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# Portal de tenants. Se mantiene como virtual host separado para que Next.js
# conserve su basePath raíz y sus assets /_next/*; el hostname es un placeholder
# deliberado hasta que el CTO defina el dominio y la CA de producción.
server {
    listen 443 ssl;
    http2 on;
    server_name portal.REPLACE_ME_PRODUCTION_DOMAIN;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;
    # CSP: ver nota del vhost principal — la emiten las apps, no se duplica aquí.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Ninguna superficie de iWana neXt usa estas APIs del navegador.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # HSTS — mismo valor de preflight que el vhost principal (max-age=300).
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    # Superficies de plataforma: no existen en este host (spec 2026-11-25 §5.2). nginx compara la
    # ruta ya decodificada y sin barras repetidas; `~*` no distingue mayúsculas.
    location ~* ^/api/v1/(auth/platform|platform|platform-users|platform-audit-logs)(/|$) {
        return 404;
    }
    location ~* ^/api/v1/tenants(?!/(me|public-branding)(/|$))(/|$) {
        return 404;
    }

    location = /health {
        limit_req zone=health_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface portal;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── Subida de lotes de importación UISP (ADR-110): ZIP por cliente de hasta 100 MB y lote de
    # hasta 200 MB (MIGRATION_IMPORT_LIMITS.maxBatchBytes; 210M deja margen al multipart y la API
    # responde su propio error). Solo esta ruta exacta amplía el cuerpo;
    # el resto del vhost conserva 10M. Mismas cabeceras que /api/.
    location = /api/v1/migration/batches {
        client_max_body_size 210M;
        proxy_request_buffering off;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface portal;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # ── Comentario de ticket con adjuntos (MOD09, spec 2026-11-16 §2.5): multipart de hasta 10
    # archivos con un video de hasta 100 MB; la API valida el Content-Length contra 110 MiB
    # (TICKET_COMMENT_ATTACHMENTS_REQUEST_MAX_BYTES) antes de leer el cuerpo. Solo esta ruta, con el
    # id del ticket acotado a UUID, amplía el cuerpo; el resto del vhost conserva 10M. Mismo patrón
    # que la subida de lotes UISP: cuerpo en streaming al API (sin búfer en disco del proxy) y
    # timeouts largos para técnicos con red móvil lenta.
    location ~ "^/api/v1/assurance/tickets/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/comments/with-attachments$" {
        client_max_body_size 110M;
        proxy_request_buffering off;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface portal;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
    }

    # H-2: la consola y los clientes llaman a /api/v1/health, no a /health.
    # Misma zona que /health; resto idéntico a `location /api/`.
    location = /api/v1/health {
        limit_req zone=health_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface portal;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface portal;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Reenviar cookies al cliente sin transformarlas. Mismo criterio que el
        # vhost principal: cubre refresh y access por audiencia (ADR-081 C-5).
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Iwana-Surface portal;
        proxy_set_header X-Iwana-Origin $scheme://$http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # SOBRESCRIBE, no anexa. `$proxy_add_x_forwarded_for` concatena el valor
        # que envió el cliente, y como el API corre con `trust proxy`, Express
        # tomaba la entrada más a la izquierda —la que el atacante controla— como
        # `req.ip`. Eso permitía evadir el bucket anónimo del rate limiter y
        # falsificaba la IP del audit trail y la del consentimiento (Ley 1581).
        # Con `$remote_addr` la cabecera lleva solo la IP real del cliente, que
        # es la precondición que `apps/api/src/main.ts` ya daba por supuesta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# ── Archivos: enlaces firmados del almacenamiento (D2, adjuntos MOD09) ─────
# La API firma con S3_PUBLIC_ENDPOINT (este host). La firma SigV4 incluye el
# host, así que se reenvía tal cual. Solo lectura: GET/HEAD del bucket privado;
# MinIO rechaza lo que no traiga firma válida y vigente. Sin consola ni API de
# administración. El dominio es un placeholder hasta que el CTO lo apruebe; el
# certificado debe cubrir este nombre.
server {
    listen 443 ssl;
    http2 on;
    server_name archivos.REPLACE_ME_PRODUCTION_DOMAIN;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Nadie sube por aquí: las subidas pasan por la API.
    client_max_body_size 1k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    location /iwana-media/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://storage;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Videos de hasta 100 MB: se entregan en flujo, sin disco intermedio.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
