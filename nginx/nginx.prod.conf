# nginx/nginx.prod.conf — Proxy inverso de producción iWana neXt (TLS)
# ============================================================================
# Routing:
#   /health      → api:3000/api/v1/health   (conveniencia)
#   /api/v1/*    → api:3000/api/v1/*        (NestJS — preserva path completo)
#   /*           → web:3001/*               (Next.js App Router)
#
# SSL:
#   Certificados: /etc/nginx/secrets/iwana-selfsigned.{crt,key}
#   Generación:   pwsh scripts/generate-certs.ps1  (staging / PoC)
#   Producción:   certificado firmado por CA (Let's Encrypt / corporativo)
# ============================================================================

upstream api {
    server api-prod:3000;
    keepalive 32;
}

upstream web {
    server web-prod:3001;
    keepalive 16;
}

# ── Redirección HTTP → HTTPS (301 Moved Permanently) ──────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── Servidor HTTPS (TLS) ──────────────────────────────────────────────────
server {
    listen 443 ssl http2 default_server;
    server_name _;

    # ── Certificados SSL ──────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/secrets/iwana-selfsigned.crt;
    ssl_certificate_key /etc/nginx/secrets/iwana-selfsigned.key;

    # ── Protocolos y cifrado ──────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Tamaño máximo del body (para uploads futuros de documentos) ──────
    client_max_body_size 10M;

    # ── Headers de seguridad ──────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Health check (acceso directo sin /api/v1 para conveniencia de Docker)
    location = /health {
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── API NestJS — /api/* → api:3000 (preserva path completo con /api/v1/)
    # Sin trailing slash en proxy_pass: Nginx pasa el path completo al upstream.
    # Ej: GET /api/v1/tenants → http://api:3000/api/v1/tenants
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # Reenviar cookies al cliente (refresh token httpOnly del API)
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Web Next.js — todo lo demás → web:3001
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
