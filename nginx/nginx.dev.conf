# nginx.dev.conf — Proxy inverso para desarrollo local
# Enruta /api/ al servicio NestJS que corre en el HOST (no en Docker)
# En dev la API se levanta con `pnpm dev` en el host; nginx la alcanza via host.docker.internal

upstream api {
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name localhost;

    # Health check del proxy
    location /health {
        proxy_pass http://api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy al API NestJS
    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Respuesta default
    location / {
        return 200 'iWana neXt — Dev Proxy OK\n';
        add_header Content-Type text/plain;
    }
}
