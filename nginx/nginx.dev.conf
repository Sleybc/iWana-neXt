# nginx.dev.conf — Proxy inverso para desarrollo local
# Enruta /api/ al servicio NestJS que corre en el HOST (no en Docker)
# En dev la API se levanta con `pnpm dev` en el host; nginx la alcanza via host.docker.internal

# Mismo patrón que nginx.prod.conf: `Connection: upgrade` solo cuando el cliente
# pide realmente un upgrade, y keepalive en el resto.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name localhost;

    # Atajo de conveniencia: /health → /api/v1/health del API. Mismo contrato que
    # el vhost de producción. Antes hacía `proxy_pass http://api/health`, que
    # llegaba al API como `/health` y devolvía 404: el prefijo global es `api/v1`.
    location = /health {
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Proxy al API NestJS. SIN barra final en proxy_pass: el path se preserva
    # íntegro, igual que en nginx.prod.conf. Con la barra, nginx strippeaba el
    # prefijo `/api/` y `/api/v1/x` llegaba al API como `/v1/x` → 404 sistemático.
    # El routing de dev y el de producción deben ser el mismo o dev no prueba nada.
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Respuesta default
    location / {
        return 200 'iWana neXt — Dev Proxy OK\n';
        add_header Content-Type text/plain;
    }
}
