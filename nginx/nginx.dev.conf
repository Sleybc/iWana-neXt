# nginx.dev.conf — Proxy inverso para desarrollo local
# Enruta /api/ al servicio NestJS que corre en el HOST (no en Docker)
# En dev la API se levanta con `pnpm dev` en el host; nginx la alcanza via host.docker.internal
#
# ADR-078 D2 (P0): desde la mitigacion de binding, la API liga a 127.0.0.1 por
# defecto. `host.docker.internal` resuelve a la IP del host en la red de Docker,
# NO a loopback, asi que con el default seguro las rutas /api/ y /health de este
# proxy devuelven 502. No rompe `pnpm dev`: el healthcheck del contenedor apunta
# a `location /`, que responde estatico, y web/portal llaman a la API directo por
# NEXT_PUBLIC_API_URL (127.0.0.1:3000), sin pasar por aqui.
#
# Para usar este proxy hay que abrir el binding de forma explicita: BIND_HOST=0.0.0.0.
# Eso reexpone la PII descifrada al segmento de red mientras no exista TLS.

upstream api {
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name localhost;

    # Health check del proxy
    location /health {
        proxy_pass http://api/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy al API NestJS
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Respuesta default
    location / {
        return 200 'iWana neXt — Dev Proxy OK\n';
        add_header Content-Type text/plain;
    }
}
