# Overlay del perfil `production`.
#
# Docker Compose interpola el documento COMPLETO antes de seleccionar servicios o
# perfiles: un `${VAR:?}` es un requisito global, no por perfil. Mientras los
# servicios de producción vivían en `docker-compose.yml`, sus variables
# obligatorias (MFA_ENCRYPTION_KEY, JWT_*, S3_*, NEXT_PUBLIC_WEB_API_URL,
# NEXT_PUBLIC_PORTAL_API_URL, …) bloqueaban
# el arranque de la infraestructura de desarrollo. Por eso viven aquí.
#
# Invocación de producción (siempre con ambos archivos):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile production --env-file .env.production <comando>
#
# Este archivo NUNCA se carga en desarrollo. Los `${VAR:?}` se conservan
# íntegros: ninguna variable de producción pierde su requisito duro.

# Los anclas YAML no cruzan archivos: los servicios propios de este overlay
# necesitan su propia declaración. Los servicios de datos heredan las del base.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-security-opt: &default-security-opt
  - no-new-privileges:true

services:
  # Los servicios de datos comparten la definición base, pero producción usa
  # nombres de contenedor y volúmenes propios para no tocar el estado de dev.
  postgres:
    container_name: iwana_postgres_prod
    volumes:
      - iwana_postgres_data_prod:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    container_name: iwana_redis_prod
    volumes:
      - iwana_redis_data_prod:/data

  pgbouncer:
    container_name: iwana_pgbouncer_prod

  minio:
    container_name: iwana_minio_prod
    volumes:
      - iwana_minio_data_prod:/data

  minio-init:
    container_name: iwana_minio_init_prod

  typesense:
    container_name: iwana_typesense_prod
    volumes:
      - iwana_typesense_data_prod:/data

  nginx-prod:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    container_name: iwana_nginx_prod
    profiles:
      - production
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # El operador monta aquí el material emitido por la CA. La carpeta
      # versionada solo contiene .gitkeep; nunca se agregan claves al repo.
      - ./secrets:/etc/nginx/tls:ro
    depends_on:
      api-prod:
        condition: service_healthy
      # `service_started` solo garantizaba que el contenedor se hubiera creado:
      # nginx aceptaba tráfico y devolvía 502 hasta que Next.js abría su puerto.
      web-prod:
        condition: service_healthy
      portal-prod:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- https://127.0.0.1/ --no-check-certificate || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    security_opt: *default-security-opt

  api-prod:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iwana_api_prod
    profiles:
      - production
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      EXECUTION_ORDER_IDEMPOTENCY_SECRET: ${EXECUTION_ORDER_IDEMPOTENCY_SECRET:?EXECUTION_ORDER_IDEMPOTENCY_SECRET is required}
      OUTBOX_RELAY_LAG_DEGRADED_SECONDS: ${OUTBOX_RELAY_LAG_DEGRADED_SECONDS-}
      OUTBOX_RELAY_LAG_STOPPED_SECONDS: ${OUTBOX_RELAY_LAG_STOPPED_SECONDS-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      MFA_ENCRYPTION_KEY_PREVIOUS: ${MFA_ENCRYPTION_KEY_PREVIOUS-}
      # SEC-P1: sin PII_HASH_KEY el bootstrap Joi falla en producción (fail-fast).
      # Debe ser distinta por entorno (A1/A2) y nunca quedar en git ni en dumps.
      PII_HASH_KEY: ${PII_HASH_KEY:?PII_HASH_KEY is required}
      # Producción termina TLS 1.3 en nginx; las cookies de sesión deben ser
      # Secure y no se permite el default de desarrollo.
      COOKIE_SECURE: ${COOKIE_SECURE:?COOKIE_SECURE is required for TLS 1.3}
      # Riesgos 1 y 2 de ADR-070: la API exige ambas con NODE_ENV=production y
      # rechaza valores localhost. Sin este cableado nunca llegarían al
      # contenedor (ignoreEnvFile en producción: solo cuenta process.env) y la
      # API fallaría al arrancar sin causa visible en el .env.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      # SMTP es opcional en desarrollo, pero se inyecta explícitamente en
      # producción para que MailerModule no dependa de un .env de la imagen.
      SMTP_HOST: ${SMTP_HOST-}
      SMTP_PORT: ${SMTP_PORT-}
      SMTP_USER: ${SMTP_USER-}
      SMTP_PASS: ${SMTP_PASS-}
      SMTP_FROM: ${SMTP_FROM-}
      SMTP_SECURE: ${SMTP_SECURE-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-iwana-media}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Producción no admite el adaptador de filesystem local.
      STORAGE_DRIVER: minio
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT: ${TYPESENSE_PORT:-8108}
    depends_on:
      migrator-prod:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # La API fija STORAGE_DRIVER=minio y TYPESENSE_API_KEY como obligatorios,
      # pero no declaraba dependencia de ninguno de los dos servicios.
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      typesense:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt: *default-security-opt

  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # C-4 (ADR-081): cada aplicacion bakea su propia variable de URL del API.
        NEXT_PUBLIC_WEB_API_URL: ${NEXT_PUBLIC_WEB_API_URL:?NEXT_PUBLIC_WEB_API_URL is required}
    container_name: iwana_web_prod
    profiles:
      - production
    expose:
      - '3001'
    environment:
      NODE_ENV: production
    depends_on:
      api-prod:
        condition: service_healthy
    # Next.js no expone una ruta de salud propia. El probe comprueba que el
    # servidor acepta la conexión y responde HTTP sin error de servidor:
    # tolera redirecciones a /auth/login y solo falla ante 5xx o socket cerrado.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt: *default-security-opt

  portal-prod:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        # C-4 (ADR-081): cada aplicacion bakea su propia variable de URL del API.
        NEXT_PUBLIC_PORTAL_API_URL: ${NEXT_PUBLIC_PORTAL_API_URL:?NEXT_PUBLIC_PORTAL_API_URL is required}
    container_name: iwana_portal_prod
    profiles:
      - production
    expose:
      - '3002'
    environment:
      NODE_ENV: production
    depends_on:
      api-prod:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3002/',(r)=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    init: true
    logging: *default-logging
    security_opt: *default-security-opt

  worker-prod:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: iwana_worker_prod
    profiles:
      - production
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      # DDL de provisioning: resolveMigrationDbCredentials() prefiere este rol.
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER is required}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      OUTBOX_RELAY_LAG_DEGRADED_SECONDS: ${OUTBOX_RELAY_LAG_DEGRADED_SECONDS-}
      OUTBOX_RELAY_LAG_STOPPED_SECONDS: ${OUTBOX_RELAY_LAG_STOPPED_SECONDS-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-iwana-media}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # El worker comparte la misma prohibición de almacenamiento local.
      STORAGE_DRIVER: minio
      # SEC-P1: el worker hash/backfill de PII exige la clave HMAC (A1/A2 por entorno).
      PII_HASH_KEY: ${PII_HASH_KEY:?PII_HASH_KEY is required}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT: ${TYPESENSE_PORT:-8108}
    healthcheck:
      # DEUDA CONOCIDA: este probe no verifica nada. `process.kill(1, 0)` solo
      # comprueba que exista el PID 1 dentro del propio contenedor, lo cual es
      # cierto mientras el contenedor viva: un worker con el loop de BullMQ
      # colgado reporta `healthy`. Sustituirlo exige un heartbeat emitido por el
      # proceso (código de aplicación), no una corrección de infraestructura.
      # Por el mismo motivo este servicio NO lleva `init: true`: cambiaría el
      # PID 1 a docker-init y volvería el probe todavía menos significativo.
      test: ['CMD-SHELL', 'node -e "process.kill(1, 0)"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # El worker también fija STORAGE_DRIVER=minio.
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrator-prod:
        condition: service_completed_successfully
      typesense:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    security_opt: *default-security-opt

  migrator-prod:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.migrator
    container_name: iwana_migrator_prod
    profiles:
      - production
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER is required}
      DB_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
      # Backfills de PII pueden requerir ambas claves durante una rotación.
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      MFA_ENCRYPTION_KEY_PREVIOUS: ${MFA_ENCRYPTION_KEY_PREVIOUS-}
      # SEC-P1: el migrator corre el backfill HMAC (108) y el contract; necesita la
      # clave por entorno (A1/A2). La ventana 2 se dispara con
      # IWANA_APPLY_PII_CONTRACT=true solo en esa corrida y se retira al terminar
      # (se inyecta por env-file o `docker compose run -e`; el CLI avisa si queda
      # activa sin contracts pendientes).
      PII_HASH_KEY: ${PII_HASH_KEY:?PII_HASH_KEY is required}
      IWANA_APPLY_PII_CONTRACT: ${IWANA_APPLY_PII_CONTRACT-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *default-logging
    security_opt: *default-security-opt

volumes:
  iwana_postgres_data_prod:
    name: iwana_postgres_data_prod
  iwana_redis_data_prod:
    name: iwana_redis_data_prod
  iwana_minio_data_prod:
    name: iwana_minio_data_prod
  iwana_typesense_data_prod:
    name: iwana_typesense_data_prod
