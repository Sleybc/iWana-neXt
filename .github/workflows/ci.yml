# .github/workflows/ci.yml
# CI pipeline iWana neXt — Lint + Typecheck + Build
# Ejecuta en push y PR a main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest

    env:
      PGPASSWORD: test

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check pending migrations (public)
        run: |
          OUTPUT=$(pnpm --filter @iwana/db migration:show 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -E "pending|not run"; then
            echo "❌ Pending migrations detected in public schema"
            exit 1
          fi
          echo "✅ No pending migrations"

      - name: Run public migrations (test)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test
        run: pnpm --filter @iwana/db migration:run

      - name: Run tenant migrations (test)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test
        run: |
          psql -h localhost -U test -d test -c "CREATE SCHEMA tenant_test;"
          psql -h localhost -U test -d test -c "INSERT INTO public.tenants (id, slug, schema_name, status) VALUES (gen_random_uuid(), 'test', 'tenant_test', 'ACTIVE');"
          pnpm --filter @iwana/db migration:tenant:run
