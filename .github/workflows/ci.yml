# .github/workflows/ci.yml
# CI pipeline iWana neXt — Lint + Typecheck + Build + Unit tests + integración DB + least-privilege gate (SEC-04 / GSEC-N1)
# R-13: pnpm test:coverage (turbo) es gate rojo — ejecuta la suite unitaria Y evalúa
# los coverageThreshold declarados por paquete (api path-specific; web y portal
# trinquete global). Actualizado el 2026-08-04: hasta esa fecha el paso corría
# `pnpm test` sin `--coverage` y NINGÚN umbral se evaluaba en CI.
# R-14: ambos scripts serializan las tareas `test` (--concurrency=1) para que la suite
# sea determinista en un runner de 2 cores. Ver nota en «Unit tests + gate de cobertura».
# Ejecuta en push y PR a main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate de integridad documental: dos validadores Node puros sin dependencias —
  #  1. citas normativas ADR (protocolo §7.4, ADR-056 propuesta SR-QA #13)
  #  2. ubicación documental TIPO → carpeta (AGENTS.md → Documentation Rules,
  #     PROMPT-TRANSVERSAL-GATE-UBICACION-DOCUMENTAL-v1.0)
  # Job propio y no el paso dentro de `ci`: no necesita pnpm install, build ni
  # PostgreSQL. Separado da señal en segundos en vez de esperar al pipeline pesado.
  # El id `adr-citations` y el display name se conservan: pueden estar referenciados
  # en branch protection (renombrarlos es un cambio de plataforma aparte).
  adr-citations:
    name: Integridad de citas ADR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive Node.js version
        id: node-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^useNodeVersion:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pnpm-workspace.yaml)"
          [[ "$version" =~ ^24\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid useNodeVersion: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Auditar citas ADR
        run: node scripts/audit-adr-citations.mjs

      - name: Auditar ubicación documental
        run: node scripts/audit-doc-locations.mjs

  production-images:
    name: Build y validación de imágenes production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive Node.js version
        id: node-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^useNodeVersion:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pnpm-workspace.yaml)"
          [[ "$version" =~ ^24\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid useNodeVersion: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # Gate sin daemon Docker: inspecciona sólo `.dockerignore` antes de los
      # cinco builds y bloquea la entrada de datos locales sensibles y cachés.
      - name: Auditar contexto Docker
        run: pnpm audit:docker-context

      # No se publican imágenes ni se inyectan secretos: este job solo valida que
      # las cinco imágenes construyan en un runner limpio. El valor público es
      # un endpoint sintético no operativo requerido por el build de Next.js.
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --build-arg NODE_VERSION=${{ steps.node-version.outputs.version }} --tag "iwana-ci/api:${GITHUB_SHA}" .

      - name: Build web image
        run: >-
          docker build --file apps/web/Dockerfile
          --build-arg NODE_VERSION=${{ steps.node-version.outputs.version }}
          --build-arg NEXT_PUBLIC_WEB_API_URL=https://ci.invalid/api/v1
          --tag "iwana-ci/web:${GITHUB_SHA}" .

      - name: Build portal image
        run: >-
          docker build --file apps/portal/Dockerfile
          --build-arg NODE_VERSION=${{ steps.node-version.outputs.version }}
          --build-arg NEXT_PUBLIC_PORTAL_API_URL=https://ci.invalid/api/v1
          --tag "iwana-ci/portal:${GITHUB_SHA}" .

      - name: Build worker image
        run: docker build --file apps/worker/Dockerfile --build-arg NODE_VERSION=${{ steps.node-version.outputs.version }} --tag "iwana-ci/worker:${GITHUB_SHA}" .

      - name: Build migrator image
        run: docker build --file packages/database/Dockerfile.migrator --build-arg NODE_VERSION=${{ steps.node-version.outputs.version }} --tag "iwana-ci/migrator:${GITHUB_SHA}" .

      # Smoke de runtime sin base de datos ni secretos para cerrar A2.
      # Valida la imagen final; no ejecuta migraciones.
      - name: Smoke migrator runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh "iwana-ci/migrator:${GITHUB_SHA}" -ec '
            set -eu

            test "$(id -u)" = "1000"
            test "$(node --version)" = "v${{ steps.node-version.outputs.version }}"

            if command -v pnpm >/dev/null 2>&1; then
              echo "pnpm no debe estar presente en la imagen de runtime" >&2
              exit 1
            fi

            test ! -e /app/src
            test ! -e /app/test
            test ! -e /app/node_modules/typescript
            test ! -e /app/node_modules/jest
            test ! -e /app/node_modules/@jest
            project_sources="$(find /app -path /app/node_modules -prune -o -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.map" -o -name "*.d.ts" \) -print -quit)"
            test -z "$project_sources"

            test -f /app/dist/data-source.js
            test -f /app/dist/cli/tenant-migrate.js
            test -f /app/dist/migrations/tenant/runner.js
            test -n "$(find /app/dist/migrations/public -maxdepth 1 -type f -name "*.js" -print -quit)"

            cd /app
            node node_modules/typeorm/cli.js --help >/dev/null
            DATA_SOURCE=./dist/data-source.js TENANT_RUNNER=./dist/migrations/tenant/runner.js \
              node --input-type=module -e "await import(process.env.DATA_SOURCE); await import(process.env.TENANT_RUNNER);"
          '

      # El perfil production vive en docker-compose.prod.yml: sus `${VAR:?}` no
      # deben bloquear la interpolación del archivo base de desarrollo.
      # COOKIE_SECURE se valida ahora desde la plantilla (.env.production.example),
      # sin variables inyectadas por el runner: así `config --quiet` prueba que la
      # plantilla sola satisface el `${COOKIE_SECURE:?}` del overlay (baseline TLS 1.3).
      - name: Validate production Compose configuration
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          --profile production --env-file .env.production.example config --quiet

      # R3.5 — prerequisitos de producción sin resolver.
      #
      # `.env.production.example` es una PLANTILLA: su propósito es contener
      # REPLACE_ME/approval-required para que el operador los sustituya en su copia
      # local `.env.production` (gitignored, nunca presente en CI). Gatear la
      # plantilla convertía este job en ROJO determinista en cada push/PR, sin
      # señal útil: el bloqueo real de producción es la decisión de dominio y CA,
      # DIFERIDA por ADR-070 (Aprobado, CTO 2026-08-02) hasta su disparador de
      # reactivación. QA-34/TLS no bloquea G6 ni G6.5; SÍ bloquea G7 (ADR-069).
      # `nginx.prod.conf` conserva `server_name portal.REPLACE_ME_PRODUCTION_DOMAIN`
      # como placeholder deliberado del mismo diferimiento, documentado en su
      # cabecera. Ver runbook RELEASE-ROLLBACK §8.5/8.6.
      #
      # El gate solo aplica donde existe un `.env.production` REAL (host de deploy
      # o preparación de release): ahí cualquier marcador residual bloquea. En CI
      # no existe ese archivo, así que el paso reporta el estado del preflight y
      # pasa — el go final sigue siendo G7/CTO, no este job.
      - name: Block unresolved production prerequisites (R3.5)
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f ".env.production" ]]; then
            echo "::notice title=R3.5 preflight::No existe .env.production en CI (la plantilla con placeholders es por diseño). Dominio y CA diferidos por ADR-070 hasta su disparador de reactivacion — no es un defecto de este job."
            exit 0
          fi

          if grep -nE '(^[^#]*=[^#]*(approval-required|REPLACE_ME))' .env.production; then
            echo '::error title=R3.5 production prerequisites blocked::[BLOQUEO] .env.production sigue usando referencias o valores REPLACE_ME/approval-required. Dominio y certificados no se inventan; el go queda escalado al CTO.'
            exit 1
          fi
          echo "✅ .env.production sin marcadores pendientes"

  ci:
    name: Lint + Typecheck + Build + Unit tests
    runs-on: ubuntu-latest

    # Ephemeral CI DB only — passwords are disposable lab values, not production secrets.
    # GSEC-N1: POSTGRES_USER (bootstrap) ≠ DB_APP_USER / DB_MIGRATOR_USER / DB_USER.
    env:
      LEAST_PRIVILEGE_MODE: host
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test
      DB_BOOTSTRAP_USER: iwana
      DB_BOOTSTRAP_PASSWORD: ci-bootstrap
      DB_USER: iwana_app
      DB_PASSWORD: ci-app
      DB_APP_USER: iwana_app
      DB_APP_PASSWORD: ci-app
      DB_MIGRATOR_USER: iwana_migrator
      DB_MIGRATOR_PASSWORD: ci-migrator

    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Bootstrap superuser — NEVER iwana_app (GSEC-N1 / SEC-04)
          POSTGRES_USER: iwana
          POSTGRES_PASSWORD: ci-bootstrap
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iwana -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive Node.js version
        id: node-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^useNodeVersion:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pnpm-workspace.yaml)"
          [[ "$version" =~ ^24\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid useNodeVersion: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate development tooling
        run: pnpm test:tooling

      - name: Check agentes multi-IDE sincronizados
        run: pnpm sync:agents:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # R-6.2 / R-13: clave AES efímera antes de unit tests y migraciones tenant.
      # Joi de AppModule se omite con NODE_ENV=test; la suite mockea ConfigService,
      # pero CLI/crypto specs y cualquier boot parcial leen process.env.
      - name: Generar MFA_ENCRYPTION_KEY efímera para CI (no persistida en repo)
        shell: bash
        run: echo "MFA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # R-13: turbo test dependsOn ^build — tras Build. Fallo = job rojo (sin continue-on-error).
      # Suite unit/HTTP mocked; no requiere Postgres.
      #
      # COBERTURA (2026-08-04, escalación 3 del INFORME-MOD02-DASHBOARD-PORTAL-AUDITORIA-
      # UIUX-v1.0, aprobada por el CTO). Hasta hoy este paso corría `pnpm test` SIN
      # `--coverage`: ningún `coverageThreshold` se evaluaba en CI — tampoco el
      # path-specific que @iwana/api ya declaraba. La compuerta existía en la
      # configuración y era inexigible en el pipeline, el patrón exacto que ADR-056
      # persigue. Ahora el paso corre `pnpm test:coverage` (package.json raíz):
      #   turbo run test --concurrency=1 --only -- --coverage
      #     --coverageReporters=text-summary --coverageReporters=json-summary
      # y jest sale ≠ 0 cuando la cobertura cae bajo el umbral del paquete:
      #   @iwana/api     path-specific (serialized-asset-useful-life.util.ts, 80/80/80/80)
      #   @iwana/web     trinquete global 36/29/32/37
      #   @iwana/portal  trinquete global 55/47/49/57
      # Los umbrales son un TRINQUETE fijado en el suelo MEDIDO, no la meta del 80%:
      # suben cuando sube la cobertura. Si uno falla NO se baja el número — se
      # investiga la regresión. Bajar el listón para que pase convierte el gate en
      # decorado y reabre el hallazgo que esta fase cierra.
      #
      # `--only` NO es cosmético: turbo mete los args de passthrough (`-- ...`) en el
      # hash de TODAS las tareas del run, incluidas las `^build` de las que depende
      # `test`. Sin `--only`, este paso invalidaría los builds que el paso «Build» acaba
      # de dejar en caché y los reejecutaría — justo la propiedad que la nota R-14
      # de abajo da por buena. Con `--only` el run contiene exclusivamente tareas
      # `test` (verificado: 6 tareas, 0 builds). Las suites de api/web/portal/worker no
      # los necesitan porque sus jest.config resuelven `@iwana/*` a `src` vía
      # moduleNameMapper; la de @iwana/db NO tiene moduleNameMapper y sus entities
      # importan `@iwana/shared`, que resuelve a `dist`. Por eso el orden de pasos es
      # LOAD-BEARING: «Build» tiene que preceder a este paso. Mover o saltar Build deja
      # a @iwana/db sin `@iwana/shared` construido. (Mismo motivo por el que
      # `pnpm test:coverage` en un checkout recién clonado y sin construir puede fallar
      # en @iwana/db: correr antes `pnpm build`. El camino de dev sigue siendo
      # `pnpm test`, que sí arrastra sus `^build`.)
      #
      # COSTE MEDIDO el 2026-08-04 (local 16 cores; el runner tiene 2):
      #   agregado, 6 tareas test sin caché:  128,3 s → 151,4 s  (+23,1 s, +18%)
      #   por app a maxWorkers=1, que es el reparto REAL del runner de 2 cores:
      #     portal  114,2 s → 133,4 s  (+19,2 s)
      #     api      84,2 s → 106,4 s  (+22,2 s)
      #     web      16,8 s →  16,7 s  (dentro del ruido)
      # Se descartó un job de cobertura aparte: obligaba a ejecutar la suite DOS veces
      # y a duplicar la exposición a los flakes de contención que R-14 costó acotar,
      # para ahorrar ~1-2 min en un job que ya dura decenas de minutos.
      # Reporters: text-summary (log legible) + json-summary (un archivo por app, lo
      # consume el paso de verificación siguiente). Sin lcov/html: 677 archivos por app
      # que nadie consume en CI.
      #
      # R-14 (hallazgo A-1): la serialización `--concurrency=1` se conserva intacta.
      # Las tareas `test` se serializan a propósito — jest ya paraleliza dentro de cada
      # paquete, y antes 6 jest concurrentes pedían más workers que cores (en este runner
      # de 2 cores el reparto es imposible: el mínimo por paquete ya es 1 worker).
      # Serializar no cuesta tiempo de pipeline: el paso «Build» ya dejó construido lo
      # que haga falta y `--only` deja fuera del run las tareas `^build`. No subir
      # testTimeout para tapar contención: si vuelve a fallar por reloj de pared, es
      # planificación, no timeout.
      - name: Unit tests + gate de cobertura
        shell: bash
        run: |
          set -o pipefail
          pnpm test:coverage 2>&1 | tee /tmp/unit-coverage.log

      # ADR-056 / hallazgo A-2: un paso verde no prueba que el gate se haya ejecutado.
      # Aquí hay DOS formas conocidas de falso verde, y las dos se cierran explícitamente:
      #
      #  1. Replay de caché. Una tarea `test` restaurada de la caché de turbo imprime la
      #     salida anterior, repone `coverage/**` y sale 0 SIN volver a evaluar ningún
      #     umbral. Hoy no puede ocurrir (CI no persiste `.turbo` ni usa remote cache) y
      #     por eso `0 cached` es una aserción segura. Si algún día deja de serlo será
      #     porque alguien activó caché compartida: eso es una decisión de plataforma que
      #     hay que tomar mirando este gate, no absorber en silencio.
      #  2. Cobertura vacía. Si `collectCoverageFrom` deja de emparejar archivos, jest
      #     mide 0/0, reporta «Unknown%» y CUALQUIER umbral pasa. No es hipotético: era
      #     el estado real de web y portal hasta el 2026-08-04. Por eso se exige
      #     denominador > 0 en las tres apps que tienen umbral.
      #
      # Este paso NO reevalúa umbrales (eso ya lo hizo jest); verifica que la evaluación
      # ocurrió sobre datos reales, y publica las cifras en el resumen del run para que
      # subir el trinquete sea una lectura, no una arqueología.
      - name: Verificar que el gate de cobertura se ejecutó de verdad
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/unit-coverage.log

          [[ -s "$LOG" ]] || { echo '::error title=Gate de cobertura::El paso de tests no dejó log (/tmp/unit-coverage.log ausente o vacío).'; exit 1; }

          if ! grep -qE '^[[:space:]]*Cached:[[:space:]]+0 cached' "$LOG"; then
            echo '::error title=Gate de cobertura::turbo sirvió tareas desde caché, o cambió el formato de su resumen. Una tarea test cacheada NO reevalúa coverageThreshold: el verde no probaría nada.'
            grep -E '^[[:space:]]*(Tasks|Cached):' "$LOG" || echo '(sin resumen de turbo en el log)'
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const apps = ["api", "web", "portal"];
            const metrics = ["statements", "branches", "functions", "lines"];
            const rows = [];
            let failed = false;

            for (const app of apps) {
              const file = `apps/${app}/coverage/coverage-summary.json`;
              if (!fs.existsSync(file)) {
                console.error(`::error title=Gate de cobertura::${file} no existe: ${app} no midió cobertura y su umbral no se evaluó.`);
                failed = true;
                continue;
              }
              const total = JSON.parse(fs.readFileSync(file, "utf8")).total;
              const denom = metrics.reduce((acc, m) => acc + total[m].total, 0);
              if (denom === 0) {
                console.error(`::error title=Gate de cobertura::${app} midió 0/0. collectCoverageFrom no empareja ningún archivo, así que cualquier umbral pasaría.`);
                failed = true;
              }
              rows.push(`| ${app} | ` + metrics.map((m) => `${total[m].pct}% (${total[m].covered}/${total[m].total})`).join(" | ") + " |");
            }

            const summaryFile = process.env.GITHUB_STEP_SUMMARY;
            if (summaryFile) {
              fs.appendFileSync(summaryFile, [
                "### Cobertura unitaria — umbrales evaluados en CI",
                "",
                "| app | statements | branches | functions | lines |",
                "| --- | --- | --- | --- | --- |",
                ...rows,
                "",
                "Umbral vigente (trinquete en el suelo medido, la meta sigue siendo 80%):",
                "web 36/29/32/37 · portal 55/47/49/57 · api path-specific 80/80/80/80.",
                "",
              ].join("\n"));
            }

            if (failed) process.exit(1);
            console.log("Cobertura medida con denominador real en api, web y portal; umbrales evaluados por jest.");
          '

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply least-privilege roles (pre-migrate)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Run public migrations (migrator)
        run: pnpm --filter @iwana/db migration:run

      - name: Re-apply least-privilege (post-migrate ownership)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Check no pending public migrations
        shell: bash
        run: |
          set -euo pipefail

          if ! OUTPUT=$(pnpm --filter @iwana/db migration:show 2>&1); then
            echo "$OUTPUT"
            echo '❌ TypeORM migration:show failed; cannot validate migration state'
            exit 1
          fi

          echo "$OUTPUT"
          if grep -Eq '\[[[:space:]]\]' <<<"$OUTPUT"; then
            echo '❌ Pending public migrations remain after migration:run (TypeORM [ ] marker)'
            exit 1
          fi
          echo "✅ No pending migrations"

      - name: Run tenant migrations (migrator)
        shell: bash
        run: |
          PGPASSWORD="${DB_MIGRATOR_PASSWORD}" psql -h "${DB_HOST}" -p "${DB_PORT}" \
            -U "${DB_MIGRATOR_USER}" -d "${DB_NAME}" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS tenant_test;"
          PGPASSWORD="${DB_MIGRATOR_PASSWORD}" psql -h "${DB_HOST}" -p "${DB_PORT}" \
            -U "${DB_MIGRATOR_USER}" -d "${DB_NAME}" \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO public.tenants (id, name, slug, schema_name, status, contact_email) VALUES (gen_random_uuid(), 'CI Test Tenant', 'test', 'tenant_test', 'ACTIVE', 'ci-tenant@example.invalid');"
          pnpm --filter @iwana/db migration:tenant:run

      # Auditoría ADR-065 (A-1 / A-2): la migración 089 sólo tenía 14 tests contra un
      # QueryRunner mockeado, que no pueden detectar los defectos para los que se
      # escribieron — BL-1 era un error de RUNTIME de PostgreSQL y D-1 un fallo
      # semántico de filtrado por schema. Un mock registra la cadena SQL; no la ejecuta.
      # Este paso ejecuta `up()` contra PostgreSQL real.
      # Va aquí porque el paso anterior ya dejó base migrada, roles least-privilege y
      # schema tenant_test. La suite crea y destruye sus propios schemas efímeros
      # (it_089_a/b/c) usando DB_MIGRATOR_USER/PASSWORD, ya presentes en el env del job:
      # no requiere ninguna variable nueva. Gate rojo: sin continue-on-error.
      - name: Integration tests — migración 089 contra PostgreSQL real
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @iwana/db test:integration 2>&1 | tee /tmp/089-integration.log

          # El spec emite `describe.skip` si su probe no alcanza PostgreSQL, y el script
          # lleva `--passWithNoTests`: ambos caminos darían VERDE sin ejercitar nada.
          # En CI la base SIEMPRE está levantada, así que un skip aquí es un fallo de
          # infraestructura y tiene que ser rojo, no un banner que nadie lee. Sin esta
          # comprobación el paso sería otra compuerta incapaz de fallar (hallazgo A-2).
          if grep -q "SUITE OMITIDA" /tmp/089-integration.log; then
            echo "❌ Suite de integración 089 OMITIDA: PostgreSQL no fue alcanzable en CI."
            exit 1
          fi
          if grep -qE "^Tests:[[:space:]]+0 total" /tmp/089-integration.log; then
            echo "❌ Suite de integración 089 no ejecutó ningún test."
            exit 1
          fi
          echo "✅ Suite de integración 089 ejecutada contra PostgreSQL real"

      # Integración del API (hallazgo A-2, ADR-065): el spec de concurrencia R2.3
      # exige `E2E_TENANT_SLUG` y el script lleva `--passWithNoTests`; sin el slug
      # emite `describe.skip` y el paso saldría VERDE sin ejercitar nada. En este
      # punto del job el tenant ACTIVE `test` (schema tenant_test) ya existe y está
      # migrado (paso "Run tenant migrations"), así que la suite corre REAL contra
      # PostgreSQL. El spec borra en afterAll los ids que crea (tracking interno);
      # deja fuera de su alcance los eventos outbox generados por createFromScheduling,
      # residuo de laboratorio en una DB efímera del runner. Gate rojo: sin
      # continue-on-error.
      - name: Integration tests — API R2.3 concurrencia contra PostgreSQL real
        shell: bash
        run: |
          set -o pipefail
          E2E_TENANT_SLUG=test pnpm --filter @iwana/api test:integration 2>&1 | tee /tmp/api-integration.log

          # El spec omite la suite si le falta E2E_TENANT_SLUG o si el probe no
          # alcanzó la DB. En CI ambas condiciones son fallos de infraestructura.
          if grep -qi "suite omitida" /tmp/api-integration.log; then
            echo "❌ Suite de integración API OMITIDA: PostgreSQL o tenant 'test' no disponibles en CI."
            exit 1
          fi
          # describe.skip deja "Tests: N skipped, N total"; un run sin tests deja
          # "0 total". Ninguno de los dos es un run real.
          if grep -qE "^Tests:[[:space:]]+0 total" /tmp/api-integration.log || \
             grep -qE "skipped" /tmp/api-integration.log; then
            echo "❌ Suite de integración API no ejecutó tests reales (0 tests o suite skipped)."
            exit 1
          fi
          echo "✅ Suite de integración API ejecutada contra PostgreSQL real (tenant test)"

      # Integración del worker (R0.3): el spec exige `R0_3_REAL_DB=1` y tira error
      # si no está; crea su propio schema efímero tenant_r03_relay_* y lo limpia en
      # afterAll, sin tocar infraestructura compartida. Las DB_* del job alimentan
      # tanto el Pool como el DataSource de migraciones (090/093) del spec. Con
      # pipefail, cualquier fallo del spec hace rojo el paso.
      - name: Integration tests — worker R0.3 relay contra PostgreSQL real
        shell: bash
        run: |
          set -o pipefail
          R0_3_REAL_DB=1 pnpm --filter @iwana/worker test:integration 2>&1 | tee /tmp/worker-integration.log

          if grep -qE "^Tests:[[:space:]]+0 total" /tmp/worker-integration.log; then
            echo "❌ Suite de integración worker no ejecutó ningún test."
            exit 1
          fi
          echo "✅ Suite de integración worker ejecutada contra PostgreSQL real"

      - name: Re-apply least-privilege (tenant audit)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Verify app cannot DROP audit trigger (SEC-04 gate)
        shell: bash
        run: |
          # Gate: exit ≠ 0 si iwana_app puede DROP TRIGGER o ownership es incorrecto
          bash scripts/db/verify-app-cannot-drop-audit-trigger.sh

  execution-orders-e2e:
    name: E2E operativo R4.1 — API + storage + BullMQ reales
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    # ── Cross-platform lockfile ──────────────────────────────────────────────
    # El lockfile de este monorepo se genera típicamente en Windows y contiene
    # optionalDependencies con `os: [win32]` (p.ej. @next/swc-win32-*, sharp-win32-*,
    # @tailwindcss/oxide-win32-*, lightningcss-win32-*). pnpm 10 en Linux las omite
    # automáticamente porque no coinciden con la plataforma del runner.
    #
    # Riesgo conocido: si un paquete pasa de optional a required en una actualización,
    # o si la versión de pnpm difiere entre generación y consumo, `--frozen-lockfile`
    # puede fallar.
    #
    # Workaround documentado: regenerar lockfile en Linux (pnpm install --no-frozen-lockfile)
    # y commitear el nuevo lockfile antes del merge a main cuando falle la validación.
    env:
      CI: true
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_CLEANUP: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive Node.js version
        id: node-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^useNodeVersion:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' pnpm-workspace.yaml)"
          [[ "$version" =~ ^24\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid useNodeVersion: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Validate lockfile cross-platform (Windows → Linux)
        id: lockfile-check
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Lockfile platform compatibility check"
          echo "Runner OS: $(uname -s)"
          echo "Runner arch: $(uname -m)"
          echo ""

          # Verificar que el lockfile es sintácticamente válido y contiene
          # snapshots para Linux (los optionalDependencies con os:win32 se omiten).
          # Usamos node para parsear el YAML sin hacer install real.
          node -e '
            const fs = require("node:fs");
            const raw = fs.readFileSync("pnpm-lock.yaml", "utf8");
            const lines = raw.split("\n").length;
            const hasLinuxPackages = raw.includes("os: [linux]") || raw.includes("os: [\"linux\"]");
            const hasWin32OnlyPackages = (raw.match(/os: \[win32\]/g) || []).length;
            console.log("Lockfile lines:", lines);
            console.log("Has Linux-specific packages:", hasLinuxPackages);
            console.log("Win32-only optional packages:", hasWin32OnlyPackages);
            if (!raw.includes("snapshots:")) {
              console.error("ERROR: lockfile no contiene sección snapshots");
              process.exit(1);
            }
            if (!raw.includes("lockfileVersion:")) {
              console.error("ERROR: lockfile no tiene lockfileVersion");
              process.exit(1);
            }
          '
          echo ""

          # El gate real es `pnpm install --frozen-lockfile` en el paso siguiente.
          # Este check solo advierte temprano si el lockfile tiene estructura
          # sospechosa antes de gastar tiempo en la instalación completa.
          echo "✅ Lockfile estructuralmente válido"
          echo ""
          echo "::notice ::Workaround si pnpm install falla: regenerar lockfile en Linux"
          echo "::notice ::  pnpm install --no-frozen-lockfile   # en un runner Linux"
          echo "::notice ::  git add pnpm-lock.yaml && git commit -m 'chore: regenerar lockfile (Linux)'"
          echo "::endgroup::"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Prueba local del parser/gate: 30/0/0/0/0 pasa; 29 o flaky > 0 falla.
      # No necesita servicios ni produce reportes.
      - name: Validate E2E marker gate logic
        run: node scripts/e2e-provision-operational.mjs --validate-playwright-markers

      # ── Credenciales efímeras por corrida (masked) ────────────────────────
      # El provisioner exige PLATFORM_SUPER_ADMIN_EMAIL/PASSWORD (fallback
      # E2E_PLATFORM_*) y la API exige EXECUTION_ORDER_IDEMPOTENCY_SECRET
      # (Joi min 32), MFA_ENCRYPTION_KEY (64 hex) y PII_HASH_KEY (64 hex,
      # SEC-P1 / apps/api/src/app.config.ts + pii-hash-key.util.ts).
      # Sin ellas el job falla en un runner limpio. Se generan por corrida y se
      # enmascaran con ::add-mask:: ANTES de escribirlas a $GITHUB_ENV. NUNCA se
      # imprimen valores, credenciales, tokens, config Compose ni envs crudos:
      # los valores viajan solo al archivo de entorno de GitHub Actions.
      - name: Generate ephemeral E2E credentials (masked, run-scoped)
        shell: bash
        run: |
          set -euo pipefail

          TS="$(date +%s)"
          PLATFORM_EMAIL="ci-platform-admin-${TS}@example.invalid"
          PLATFORM_PASSWORD="E2eA1!$(openssl rand -hex 18)"
          IDEMPOTENCY_SECRET="$(openssl rand -hex 24)"
          MFA_KEY="$(openssl rand -hex 32)"
          PII_HASH_KEY="$(openssl rand -hex 32)"

          echo "::add-mask::${PLATFORM_EMAIL}"
          echo "::add-mask::${PLATFORM_PASSWORD}"
          echo "::add-mask::${IDEMPOTENCY_SECRET}"
          echo "::add-mask::${MFA_KEY}"
          echo "::add-mask::${PII_HASH_KEY}"

          echo "PLATFORM_SUPER_ADMIN_EMAIL=${PLATFORM_EMAIL}" >> "$GITHUB_ENV"
          echo "PLATFORM_SUPER_ADMIN_PASSWORD=${PLATFORM_PASSWORD}" >> "$GITHUB_ENV"
          echo "EXECUTION_ORDER_IDEMPOTENCY_SECRET=${IDEMPOTENCY_SECRET}" >> "$GITHUB_ENV"
          echo "MFA_ENCRYPTION_KEY=${MFA_KEY}" >> "$GITHUB_ENV"
          echo "PII_HASH_KEY=${PII_HASH_KEY}" >> "$GITHUB_ENV"

          echo "✅ Credenciales E2E efímeras generadas y enmascaradas (sin valores en logs)"

      # ── Vertical E2E: provision script ────────────────────────────────────
      # `scripts/e2e-provision-operational.mjs` es el orquestador atómico:
      #   1. docker compose up -d --wait postgres, redis, minio, typesense
      #   2. docker compose run minio-init (bootstrap del bucket)
      #   3. pnpm build shared → storage → database
      #   4. pnpm db:migrate:all (public + tenant schemas)
      #   5. docker compose up -d --build --wait worker-e2e (BullMQ con healthcheck)
      #   6. pnpm --filter @iwana/api dev (API en el host, healthcheck via /api/v1/health)
      #   7. Provisiona tenants, usuarios, fixtures de inventario y business hours
      #   8. Ejecuta ambos specs API reales: órdenes operativas + aislamiento de
      #      audit logs con AUDITOR y dos tenants.
      #   9. Cleanup: tenants, schemas, worker, API process, docker compose down
      #
      # Las credenciales se generan aleatoriamente en memoria. Nunca se imprimen
      # ni se escriben en archivos versionados.
      #
      # La salida completa se tee a /tmp/e2e-provision.log: el paso de
      # verificación de gates consume los marcadores no secretos que el
      # provisioner publica por stdout (E2E_SETUP=OK, E2E_PLAYWRIGHT_*,
      # E2E_CLEANUP=OK). pipefail conserva el exit code del provisioner como
      # fallo del paso (el tee por sí solo devolvería 0 siempre).
      - name: Provision and execute R4.1 against real services
        id: e2e
        shell: bash
        run: |
          set -o pipefail
          node scripts/e2e-provision-operational.mjs 2>&1 | tee /tmp/e2e-provision.log

      # ── Verificación explícita de gates E2E ───────────────────────────────
      # El job FALLA si cualquiera de: E2E_SETUP=OK ausente, exit ≠ 0, tests
      # fallidos > 0, skipped > 0, did-not-run > 0, flaky/retried > 0,
      # passed < 30 (REQUIRED_OPERATIONAL_E2E_PASSED en el provisioner),
      # resumen de Playwright sin parsear, o E2E_CLEANUP=OK ausente/FAILED/DISABLED.
      # Condiciones explícitas sobre los marcadores publicados por el
      # provisioner (log teeed en el paso e2e); no confía en exit codes solos.
      # Ausencia de evidencia = fallo, nunca falso verde.
      - name: Verify E2E R4.1 gates (markers, counts, cleanup)
        id: verify-e2e
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG="/tmp/e2e-provision.log"

          [[ -s "$LOG" ]] || { echo "::error title=E2E gate::El provisioner no dejó log (/tmp/e2e-provision.log ausente o vacío)."; exit 1; }
          node scripts/e2e-provision-operational.mjs --verify-playwright-markers "$LOG"

      # ── Diagnóstico en fallo ──────────────────────────────────────────────
      # Si el provision script o los tests fallan, se capturan las últimas
      # líneas de logs de los contenedores para diagnóstico. Sin secretos.
      - name: Docker logs on failure
        id: docker-logs
        if: failure() && steps.e2e.outcome == 'failure'
        shell: bash
        run: |
          echo "::group::PostgreSQL E2E logs (cola)"
          docker logs iwana_postgres_e2e --tail 80 2>&1 || echo "(contenedor no disponible)"
          echo "::endgroup::"
          echo "::group::Worker E2E logs (cola)"
          docker logs iwana_worker_e2e --tail 80 2>&1 || echo "(contenedor no disponible)"
          echo "::endgroup::"
          echo "::group::Redis E2E logs (cola)"
          docker logs iwana_redis_e2e --tail 30 2>&1 || echo "(contenedor no disponible)"
          echo "::endgroup::"
          echo "::group::MinIO E2E logs (cola)"
          docker logs iwana_minio_e2e --tail 30 2>&1 || echo "(contenedor no disponible)"
          echo "::endgroup::"

      # ── Artefacto resumen (sanitizado) ────────────────────────────────────
      # Reemplaza la subida cruda de test-results/ y playwright-report/ (que
      # podían contener tokens de sesión y credenciales efímeras). Se genera
      # UN artefacto de texto con datos no sensibles: SHA del workflow, OS del
      # runner, versiones de node/pnpm, estado de los jobs del run (incluye los
      # builds Docker de production-images), conteos y duración, y estado de
      # cleanup. Comandos puros del shell, sin volcar envs ni tokens.
      - name: Generate E2E R4.1 summary (sanitized)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/e2e-summary
          SUMMARY="/tmp/e2e-summary/e2e-r41-summary.txt"
          {
            echo "iWana neXt — E2E R4.1 summary (sanitized, sin tokens ni datos de sesión)"
            echo "======================================================================="
            echo "workflow: ${{ github.workflow }}"
            echo "run_id: ${{ github.run_id }}  attempt: ${{ github.run_attempt }}"
            echo "commit: ${{ github.sha }}  ref: ${{ github.ref }}  event: ${{ github.event_name }}"
            echo "runner: ${{ runner.os }} (${{ runner.arch }})"
            echo "node: $(node --version)   pnpm: $(pnpm --version)"
            echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "estado de jobs del run (builds incluidos):"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '.jobs[] | "  \(.name): \(.conclusion // "in_progress")"' 2>/dev/null \
              || echo "  (no disponible — fallback local, no bloquea)"
            echo ""
            echo "outcomes de pasos de este job:"
            echo "  e2e provision: ${{ steps.e2e.outcome }}"
            echo "  gates verify:  ${{ steps.verify-e2e.outcome }}"
            echo "  docker logs:   ${{ steps.docker-logs.outcome }}"
            echo ""
            echo "marcadores E2E (no secretos):"
            grep -E '^(E2E_SETUP=OK|E2E_PLAYWRIGHT_(EXIT|PASSED|FAILED|SKIPPED|DID_NOT_RUN|FLAKY|DURATION_MS)=|E2E_TOTAL_DURATION_MS=|E2E_CLEANUP=OK)' \
              /tmp/e2e-provision.log 2>/dev/null || echo "  (sin marcadores en el log)"
          } > "$SUMMARY"

      - name: Upload E2E R4.1 summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-r41-summary
          path: /tmp/e2e-summary/
          if-no-files-found: error

      # ── Safety-net cleanup ───────────────────────────────────────────────
      # El provision script hace su propia limpieza en el bloque finally, pero
      # si el proceso muere con SIGKILL (OOM, timeout del runner), los
      # contenedores y volúmenes pueden quedar huérfanos. Este paso los elimina.
      - name: Cleanup E2E infrastructure (safety net)
        if: always()
        shell: bash
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e.yml \
            -p iwana-e2e-r41 \
            --profile development \
            --profile e2e \
            down --remove-orphans --volumes --timeout 30 2>/dev/null || true
