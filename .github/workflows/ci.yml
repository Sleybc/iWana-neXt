# .github/workflows/ci.yml
# CI pipeline iWana neXt — Lint + Typecheck + Build + least-privilege gate (SEC-04 / GSEC-N1)
# Ejecuta en push y PR a main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate de integridad de citas normativas ADR (protocolo §7.4, ADR-056 propuesta SR-QA #13).
  # Job propio y no el paso dentro de `ci`: el validador es Node puro sin dependencias,
  # no necesita pnpm install, build ni PostgreSQL. Separado da señal en segundos en vez
  # de esperar al pipeline pesado.
  adr-citations:
    name: Integridad de citas ADR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Auditar citas ADR
        run: node scripts/audit-adr-citations.mjs

  ci:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest

    # Ephemeral CI DB only — passwords are disposable lab values, not production secrets.
    # GSEC-N1: POSTGRES_USER (bootstrap) ≠ DB_APP_USER / DB_MIGRATOR_USER / DB_USER.
    env:
      LEAST_PRIVILEGE_MODE: host
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test
      DB_BOOTSTRAP_USER: iwana
      DB_BOOTSTRAP_PASSWORD: ci-bootstrap
      DB_USER: iwana_app
      DB_PASSWORD: ci-app
      DB_APP_USER: iwana_app
      DB_APP_PASSWORD: ci-app
      DB_MIGRATOR_USER: iwana_migrator
      DB_MIGRATOR_PASSWORD: ci-migrator

    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Bootstrap superuser — NEVER iwana_app (GSEC-N1 / SEC-04)
          POSTGRES_USER: iwana
          POSTGRES_PASSWORD: ci-bootstrap
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iwana -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check agentes multi-IDE sincronizados
        run: pnpm sync:agents:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply least-privilege roles (pre-migrate)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Run public migrations (migrator)
        run: pnpm --filter @iwana/db migration:run

      - name: Re-apply least-privilege (post-migrate ownership)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Check no pending public migrations
        run: |
          OUTPUT=$(pnpm --filter @iwana/db migration:show 2>&1 || true)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -E "pending|not run"; then
            echo "❌ Pending migrations remain in public schema after migration:run"
            exit 1
          fi
          echo "✅ No pending migrations"

      - name: Run tenant migrations (migrator)
        shell: bash
        run: |
          PGPASSWORD="${DB_MIGRATOR_PASSWORD}" psql -h "${DB_HOST}" -p "${DB_PORT}" \
            -U "${DB_MIGRATOR_USER}" -d "${DB_NAME}" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS tenant_test;"
          PGPASSWORD="${DB_MIGRATOR_PASSWORD}" psql -h "${DB_HOST}" -p "${DB_PORT}" \
            -U "${DB_MIGRATOR_USER}" -d "${DB_NAME}" \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO public.tenants (id, name, slug, schema_name, status, contact_email) VALUES (gen_random_uuid(), 'CI Test Tenant', 'test', 'tenant_test', 'ACTIVE', 'ci-tenant@example.invalid');"
          pnpm --filter @iwana/db migration:tenant:run

      - name: Re-apply least-privilege (tenant audit)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Verify app cannot DROP audit trigger (SEC-04 gate)
        shell: bash
        run: |
          # Gate: exit ≠ 0 si iwana_app puede DROP TRIGGER o ownership es incorrecto
          bash scripts/db/verify-app-cannot-drop-audit-trigger.sh
