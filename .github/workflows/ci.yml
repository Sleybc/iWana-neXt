# .github/workflows/ci.yml
# CI pipeline iWana neXt — Lint + Typecheck + Build + Unit tests + integración DB + least-privilege gate (SEC-04 / GSEC-N1)
# R-13: pnpm test (turbo) es gate rojo; sin umbral cobertura 80% en este paso.
# R-14: pnpm test serializa las tareas `test` (--concurrency=1) para que la suite sea
# determinista en un runner de 2 cores. Ver nota en el paso «Unit tests».
# Ejecuta en push y PR a main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Gate de integridad documental: dos validadores Node puros sin dependencias —
  #  1. citas normativas ADR (protocolo §7.4, ADR-056 propuesta SR-QA #13)
  #  2. ubicación documental TIPO → carpeta (AGENTS.md → Documentation Rules,
  #     PROMPT-TRANSVERSAL-GATE-UBICACION-DOCUMENTAL-v1.0)
  # Job propio y no el paso dentro de `ci`: no necesita pnpm install, build ni
  # PostgreSQL. Separado da señal en segundos en vez de esperar al pipeline pesado.
  # El id `adr-citations` y el display name se conservan: pueden estar referenciados
  # en branch protection (renombrarlos es un cambio de plataforma aparte).
  adr-citations:
    name: Integridad de citas ADR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Auditar citas ADR
        run: node scripts/audit-adr-citations.mjs

      - name: Auditar ubicación documental
        run: node scripts/audit-doc-locations.mjs

  production-images:
    name: Build y validación de imágenes production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No se publican imágenes ni se inyectan secretos: este job solo valida que
      # las cinco imágenes construyan en un runner limpio. El valor público es
      # un endpoint sintético no operativo requerido por el build de Next.js.
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag "iwana-ci/api:${GITHUB_SHA}" .

      - name: Build web image
        run: >-
          docker build --file apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=https://ci.invalid/api/v1
          --tag "iwana-ci/web:${GITHUB_SHA}" .

      - name: Build portal image
        run: >-
          docker build --file apps/portal/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=https://ci.invalid/api/v1
          --tag "iwana-ci/portal:${GITHUB_SHA}" .

      - name: Build worker image
        run: docker build --file apps/worker/Dockerfile --tag "iwana-ci/worker:${GITHUB_SHA}" .

      - name: Build migrator image
        run: docker build --file packages/database/Dockerfile.migrator --tag "iwana-ci/migrator:${GITHUB_SHA}" .

      # El perfil production vive en docker-compose.prod.yml: sus `${VAR:?}` no
      # deben bloquear la interpolación del archivo base de desarrollo.
      - name: Validate production Compose configuration
        env:
          # El baseline productivo TLS 1.3 exige cookies Secure. La plantilla de
          # producción no lo fija porque sigue siendo un preflight, no un release.
          COOKIE_SECURE: 'true'
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.prod.yml
          --profile production --env-file .env.production.example config --quiet

      - name: Block unresolved production prerequisites (R3.5)
        shell: bash
        run: |
          set -euo pipefail

          if grep -nE '(^[^#]*=[^#]*(approval-required|REPLACE_ME)|^[[:space:]]*server_name[[:space:]]+[^;]*(REPLACE_ME))' \
            .env.production.example nginx/nginx.prod.conf; then
            echo '::error title=R3.5 production prerequisites blocked::[BLOQUEO] Producción sigue usando referencias o valores REPLACE_ME/approval-required. Dominio y certificados no se inventan; el go queda escalado al CTO.'
            exit 1
          fi

  ci:
    name: Lint + Typecheck + Build + Unit tests
    runs-on: ubuntu-latest

    # Ephemeral CI DB only — passwords are disposable lab values, not production secrets.
    # GSEC-N1: POSTGRES_USER (bootstrap) ≠ DB_APP_USER / DB_MIGRATOR_USER / DB_USER.
    env:
      LEAST_PRIVILEGE_MODE: host
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test
      DB_BOOTSTRAP_USER: iwana
      DB_BOOTSTRAP_PASSWORD: ci-bootstrap
      DB_USER: iwana_app
      DB_PASSWORD: ci-app
      DB_APP_USER: iwana_app
      DB_APP_PASSWORD: ci-app
      DB_MIGRATOR_USER: iwana_migrator
      DB_MIGRATOR_PASSWORD: ci-migrator

    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Bootstrap superuser — NEVER iwana_app (GSEC-N1 / SEC-04)
          POSTGRES_USER: iwana
          POSTGRES_PASSWORD: ci-bootstrap
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iwana -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check agentes multi-IDE sincronizados
        run: pnpm sync:agents:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # R-6.2 / R-13: clave AES efímera antes de unit tests y migraciones tenant.
      # Joi de AppModule se omite con NODE_ENV=test; la suite mockea ConfigService,
      # pero CLI/crypto specs y cualquier boot parcial leen process.env.
      - name: Generar MFA_ENCRYPTION_KEY efímera para CI (no persistida en repo)
        shell: bash
        run: echo "MFA_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # R-13: turbo test dependsOn ^build — tras Build. Fallo = job rojo (sin continue-on-error).
      # Sin --coverage / umbral 80% (fase posterior). Suite unit/HTTP mocked; no requiere Postgres.
      # R-14 (hallazgo A-1): `pnpm test` es `turbo run test --concurrency=1`. Las tareas
      # `test` se serializan a propósito — jest ya paraleliza dentro de cada paquete, y
      # antes 6 jest concurrentes pedían más workers que cores (en este runner de 2 cores
      # el reparto es imposible: el mínimo por paquete ya es 1 worker). Los `^build` de
      # los que depende son cache HIT de turbo porque el paso Build ya corrió en este job,
      # así que serializar no cuesta tiempo de pipeline. No subir testTimeout para tapar
      # contención: si vuelve a fallar por reloj de pared, es planificación, no timeout.
      - name: Unit tests
        run: pnpm test

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Apply least-privilege roles (pre-migrate)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Run public migrations (migrator)
        run: pnpm --filter @iwana/db migration:run

      - name: Re-apply least-privilege (post-migrate ownership)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Check no pending public migrations
        shell: bash
        run: |
          set -euo pipefail

          if ! OUTPUT=$(pnpm --filter @iwana/db migration:show 2>&1); then
            echo "$OUTPUT"
            echo '❌ TypeORM migration:show failed; cannot validate migration state'
            exit 1
          fi

          echo "$OUTPUT"
          if grep -Eq '\[[[:space:]]\]' <<<"$OUTPUT"; then
            echo '❌ Pending public migrations remain after migration:run (TypeORM [ ] marker)'
            exit 1
          fi
          echo "✅ No pending migrations"

      - name: Run tenant migrations (migrator)
        shell: bash
        run: |
          PGPASSWORD="${DB_MIGRATOR_PASSWORD}" psql -h "${DB_HOST}" -p "${DB_PORT}" \
            -U "${DB_MIGRATOR_USER}" -d "${DB_NAME}" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE SCHEMA IF NOT EXISTS tenant_test;"
          PGPASSWORD="${DB_MIGRATOR_PASSWORD}" psql -h "${DB_HOST}" -p "${DB_PORT}" \
            -U "${DB_MIGRATOR_USER}" -d "${DB_NAME}" \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO public.tenants (id, name, slug, schema_name, status, contact_email) VALUES (gen_random_uuid(), 'CI Test Tenant', 'test', 'tenant_test', 'ACTIVE', 'ci-tenant@example.invalid');"
          pnpm --filter @iwana/db migration:tenant:run

      # Auditoría ADR-065 (A-1 / A-2): la migración 089 sólo tenía 14 tests contra un
      # QueryRunner mockeado, que no pueden detectar los defectos para los que se
      # escribieron — BL-1 era un error de RUNTIME de PostgreSQL y D-1 un fallo
      # semántico de filtrado por schema. Un mock registra la cadena SQL; no la ejecuta.
      # Este paso ejecuta `up()` contra PostgreSQL real.
      # Va aquí porque el paso anterior ya dejó base migrada, roles least-privilege y
      # schema tenant_test. La suite crea y destruye sus propios schemas efímeros
      # (it_089_a/b/c) usando DB_MIGRATOR_USER/PASSWORD, ya presentes en el env del job:
      # no requiere ninguna variable nueva. Gate rojo: sin continue-on-error.
      - name: Integration tests — migración 089 contra PostgreSQL real
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @iwana/db test:integration 2>&1 | tee /tmp/089-integration.log

          # El spec emite `describe.skip` si su probe no alcanza PostgreSQL, y el script
          # lleva `--passWithNoTests`: ambos caminos darían VERDE sin ejercitar nada.
          # En CI la base SIEMPRE está levantada, así que un skip aquí es un fallo de
          # infraestructura y tiene que ser rojo, no un banner que nadie lee. Sin esta
          # comprobación el paso sería otra compuerta incapaz de fallar (hallazgo A-2).
          if grep -q "SUITE OMITIDA" /tmp/089-integration.log; then
            echo "❌ Suite de integración 089 OMITIDA: PostgreSQL no fue alcanzable en CI."
            exit 1
          fi
          if grep -qE "^Tests:[[:space:]]+0 total" /tmp/089-integration.log; then
            echo "❌ Suite de integración 089 no ejecutó ningún test."
            exit 1
          fi
          echo "✅ Suite de integración 089 ejecutada contra PostgreSQL real"

      - name: Re-apply least-privilege (tenant audit)
        shell: bash
        run: bash scripts/db/apply-least-privilege.sh

      - name: Verify app cannot DROP audit trigger (SEC-04 gate)
        shell: bash
        run: |
          # Gate: exit ≠ 0 si iwana_app puede DROP TRIGGER o ownership es incorrecto
          bash scripts/db/verify-app-cannot-drop-audit-trigger.sh
