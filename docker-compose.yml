services:
  # Postgres local. POSTGRES_USER es el superusuario de bootstrap del volumen y
  # sale de DB_BOOTSTRAP_USER (default 'iwana') — NUNCA de DB_USER.
  #
  # GSEC-N1: en un datadir vacio el entrypoint de Postgres crea POSTGRES_USER como
  # SUPERUSER. Cuando esto colgaba de DB_USER y .env paso a DB_USER=iwana_app
  # (remediacion SEC-04), el rol de aplicacion quedaba superusuario y anulaba SEC-04
  # en silencio. DB_BOOTSTRAP_USER desacopla ambos y docker/postgres/init/01-create-roles.sh
  # falla en duro si alguien vuelve a acoplarlos.
  #
  # DB_USER es SOLO el rol de aplicacion de API/worker (hoy iwana_app); los roles
  # iwana_app / iwana_migrator se crean en el primer init (docker/postgres/init).
  # Ver docs/runbooks/RUNBOOK-DB-LEAST-PRIVILEGE-v1.0.md.
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.3-alpine}
    container_name: iwana_postgres_dev
    profiles:
      - development
      - production
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:?DB_BOOTSTRAP_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-dbiw}
      # Roles least-privilege (solo primer init del volumen; passwords lab = DB_PASSWORD)
      DB_APP_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER is required}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
    expose:
      - '5432'
    volumes:
      - iwana_postgres_data_dev:/var/lib/postgresql
      # Init scripts: solo en datadir vacío. Volúmenes existentes → scripts/db/apply-least-privilege.sql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_BOOTSTRAP_USER:?DB_BOOTSTRAP_USER is required} -d ${DB_NAME:-dbiw}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:8.6-alpine}
    container_name: iwana_redis_dev
    profiles:
      - development
      - production
    command: redis-server --save 60 1 --loglevel warning
    expose:
      - '6379'
    volumes:
      - iwana_redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  pgbouncer:
    image: ${PGBOUNCER_IMAGE:?PGBOUNCER_IMAGE is required}
    container_name: iwana_pgbouncer_dev
    profiles:
      - development
      - production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    expose:
      - '6432'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    container_name: iwana_minio_dev
    profiles:
      - development
      - production
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    expose:
      - '9000'
      - '9001'
    volumes:
      - iwana_minio_data_dev:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: ${MINIO_MC_IMAGE:?MINIO_MC_IMAGE is required}
    container_name: iwana_minio_init_dev
    profiles:
      - development
      - production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-iwana-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set iwana-local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "iwana-local/$${S3_BUCKET}"
        mc anonymous set private "iwana-local/$${S3_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  typesense:
    image: ${TYPESENSE_IMAGE:-typesense/typesense:28.0}
    container_name: iwana_typesense_dev
    profiles:
      - development
      - production
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      --enable-cors
    expose:
      - '8108'
    volumes:
      - iwana_typesense_data_dev:/data
    healthcheck:
      test: ['CMD-SHELL', "bash -ec '</dev/tcp/127.0.0.1/8108'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    container_name: iwana_nginx_dev
    profiles:
      - development
    ports:
      - '${DEV_PROXY_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  nginx-prod:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    container_name: iwana_nginx_prod
    profiles:
      - production
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # El operador monta aquí el material emitido por la CA. La carpeta
      # versionada solo contiene .gitkeep; nunca se agregan claves al repo.
      - ./secrets:/etc/nginx/tls:ro
    depends_on:
      api-prod:
        condition: service_healthy
      web-prod:
        condition: service_started
      portal-prod:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- https://127.0.0.1/ --no-check-certificate || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api-prod:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iwana_api_prod
    profiles:
      - production
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      EXECUTION_ORDER_IDEMPOTENCY_SECRET: ${EXECUTION_ORDER_IDEMPOTENCY_SECRET:?EXECUTION_ORDER_IDEMPOTENCY_SECRET is required}
      OUTBOX_RELAY_LAG_DEGRADED_SECONDS: ${OUTBOX_RELAY_LAG_DEGRADED_SECONDS-}
      OUTBOX_RELAY_LAG_STOPPED_SECONDS: ${OUTBOX_RELAY_LAG_STOPPED_SECONDS-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-iwana-media}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Producción no admite el adaptador de filesystem local.
      STORAGE_DRIVER: minio
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_HOST: ${TYPESENSE_HOST:-typesense}
      TYPESENSE_PORT: ${TYPESENSE_PORT:-8108}
    depends_on:
      migrator-prod:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  web-prod:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    container_name: iwana_web_prod
    profiles:
      - production
    expose:
      - '3001'
    environment:
      NODE_ENV: production
    depends_on:
      api-prod:
        condition: service_healthy
    restart: unless-stopped

  portal-prod:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    container_name: iwana_portal_prod
    profiles:
      - production
    expose:
      - '3002'
    environment:
      NODE_ENV: production
    depends_on:
      api-prod:
        condition: service_healthy
    restart: unless-stopped

  worker-prod:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: iwana_worker_prod
    profiles:
      - production
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_APP_USER:?DB_APP_USER is required}
      DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      OUTBOX_RELAY_LAG_DEGRADED_SECONDS: ${OUTBOX_RELAY_LAG_DEGRADED_SECONDS-}
      OUTBOX_RELAY_LAG_STOPPED_SECONDS: ${OUTBOX_RELAY_LAG_STOPPED_SECONDS-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-iwana-media}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # El worker comparte la misma prohibición de almacenamiento local.
      STORAGE_DRIVER: minio
    healthcheck:
      # El worker es un consumidor BullMQ y no expone HTTP. Este probe verifica
      # que su proceso PID 1 siga vivo sin abrir un puerto de administración.
      test: ['CMD-SHELL', 'node -e "process.kill(1, 0)"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  migrator-prod:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.migrator
    container_name: iwana_migrator_prod
    profiles:
      - production
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_MIGRATOR_USER:?DB_MIGRATOR_USER is required}
      DB_PASSWORD: ${DB_MIGRATOR_PASSWORD:?DB_MIGRATOR_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  adminer:
    image: ${ADMINER_IMAGE:?ADMINER_IMAGE is required}
    container_name: iwana_adminer_dev
    profiles:
      - development
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  iwana_postgres_data_dev:
    name: iwana_postgres_data_dev
  iwana_redis_data_dev:
    name: iwana_redis_data_dev
  iwana_minio_data_dev:
    name: iwana_minio_data_dev
  iwana_typesense_data_dev:
    name: iwana_typesense_data_dev
