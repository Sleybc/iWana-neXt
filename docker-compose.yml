# docker-compose.yml — Stack de producción iWana neXt
# Uso: docker compose up -d --build
# Acceso: http://10.0.0.2:${APP_PORT:-8080}
#
# Servicios: postgres · redis · api · worker · web · nginx
#
# Para cambiar el puerto: editar APP_PORT en .env, luego:
#   docker compose build web  (NEXT_PUBLIC_API_URL está bakeado)
#   docker compose up -d

services:
  # ── PostgreSQL 18 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: iwana_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - iwana_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Redis 8 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: iwana_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
    volumes:
      - iwana_redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $$REDIS_PASSWORD ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  # ── Migrator (ejecuta migraciones y seed) ─────────────────────────────────
  migrator:
    build:
      context: .
      dockerfile: packages/database/Dockerfile.migrator
    container_name: iwana_migrator
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    command: ['node', 'dist/cli/tenant-migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # ── API NestJS ────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iwana_api
    environment:
      NODE_ENV: production
      PORT: 3000
      # Base de datos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Redis (con password para producción)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      # JWT RS256 — contenido PEM con saltos de línea escapados como \n
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      # AES-256-GCM para cifrado de MFA secrets (64 hex chars = 256 bits)
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      # CORS — origen del browser (incluye puerto público)
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Cookie Secure: false para HTTP on-prem, true solo con HTTPS/TLS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Bootstrap SYSTEM_ADMIN — se ejecuta una sola vez en startup
      PLATFORM_SUPER_ADMIN_EMAIL: ${PLATFORM_SUPER_ADMIN_EMAIL}
      PLATFORM_SUPER_ADMIN_PASSWORD: ${PLATFORM_SUPER_ADMIN_PASSWORD}
      # URL del frontend para links en emails (forgot-password, etc.)
      FRONTEND_URL: ${WEB_URL}
      APP_NAME: ${APP_NAME:-iWana neXt}
      # SMTP — si SMTP_HOST está vacío, MailerService usa modo dev (imprime en logs)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@iwana.local}
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ── Worker BullMQ ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: iwana_worker
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      PLATFORM_SUPER_ADMIN_EMAIL: ${PLATFORM_SUPER_ADMIN_EMAIL}
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Web Next.js ───────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Bakeado en el bundle en tiempo de build.
        # Si cambia APP_PORT: editar .env + ejecutar: docker compose build web
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: iwana_web
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (proxy + puerto público configurable) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: iwana_nginx
    ports:
      # Cambiar APP_PORT en .env si el puerto está ocupado
      - '${APP_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

# ── Volúmenes persistentes ────────────────────────────────────────────────
volumes:
  iwana_postgres_data:
    name: iwana_postgres_data
  iwana_redis_data:
    name: iwana_redis_data
