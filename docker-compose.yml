# docker-compose.yml — Stack de producción iWana neXt
# Requiere variables de entorno definidas en .env (no versionado)
# Sin Adminer. Sin contraseñas hardcodeadas.

services:
  postgres:
    image: postgres:16-alpine
    container_name: iwana_postgres
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - iwana_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - iwana_internal
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: iwana_redis
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD} --loglevel warning
    volumes:
      - iwana_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iwana_internal
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: iwana_pgbouncer
    environment:
      DB_USER: ${DATABASE_USERNAME}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DATABASE_NAME}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iwana_internal
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: iwana_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - iwana_minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - iwana_internal
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: iwana_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iwana_internal
      - iwana_external
    restart: unless-stopped

volumes:
  iwana_postgres_data:
    name: iwana_postgres_data
  iwana_redis_data:
    name: iwana_redis_data
  iwana_minio_data:
    name: iwana_minio_data

networks:
  iwana_internal:
    name: iwana_internal
    driver: bridge
  iwana_external:
    name: iwana_external
    driver: bridge
