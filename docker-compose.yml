services:
  # Postgres local. POSTGRES_USER es el superusuario de bootstrap del volumen y
  # sale de DB_BOOTSTRAP_USER (default 'iwana') — NUNCA de DB_USER.
  #
  # GSEC-N1: en un datadir vacio el entrypoint de Postgres crea POSTGRES_USER como
  # SUPERUSER. Cuando esto colgaba de DB_USER y .env paso a DB_USER=iwana_app
  # (remediacion SEC-04), el rol de aplicacion quedaba superusuario y anulaba SEC-04
  # en silencio. DB_BOOTSTRAP_USER desacopla ambos y docker/postgres/init/01-create-roles.sh
  # falla en duro si alguien vuelve a acoplarlos.
  #
  # DB_USER es SOLO el rol de aplicacion de API/worker (hoy iwana_app); los roles
  # iwana_app / iwana_migrator se crean en el primer init (docker/postgres/init).
  # Ver docs/runbooks/RUNBOOK-DB-LEAST-PRIVILEGE-v1.0.md.
  postgres:
    image: postgres:18-alpine
    container_name: iwana_postgres_dev
    environment:
      POSTGRES_USER: ${DB_BOOTSTRAP_USER:-iwana}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-dbiw}
      # Roles least-privilege (solo primer init del volumen; passwords lab = DB_PASSWORD)
      DB_APP_USER: ${DB_APP_USER:-iwana_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-${DB_PASSWORD}}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-iwana_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:-${DB_PASSWORD}}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - iwana_postgres_data_dev:/var/lib/postgresql
      # Init scripts: solo en datadir vacío. Volúmenes existentes → scripts/db/apply-least-privilege.sql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_BOOTSTRAP_USER:-iwana} -d ${DB_NAME:-dbiw}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: iwana_redis_dev
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - iwana_redis_data_dev:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: iwana_pgbouncer_dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-iwana}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-dbiw}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    ports:
      - '${PGBOUNCER_PORT:-6433}:6432'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: iwana_minio_dev
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - '${MINIO_API_PORT:-9002}:9000'
      - '${MINIO_CONSOLE_PORT:-9003}:9001'
    volumes:
      - iwana_minio_data_dev:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: iwana_minio_init_dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      S3_BUCKET: ${S3_BUCKET:-iwana-media}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set iwana-local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "iwana-local/$${S3_BUCKET}"
        mc anonymous set private "iwana-local/$${S3_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'

  typesense:
    image: typesense/typesense:28.0
    container_name: iwana_typesense_dev
    command: >
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-CHANGE_ME_TYPESENSE_DEV_KEY}
      --enable-cors
    ports:
      - '${TYPESENSE_PORT:-8108}:8108'
    volumes:
      - iwana_typesense_data_dev:/data
    healthcheck:
      test: ['CMD-SHELL', "bash -ec '</dev/tcp/127.0.0.1/8108'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: iwana_nginx_dev
    ports:
      - '${DEV_PROXY_PORT:-8080}:80'
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  nginx-prod:
    image: nginx:alpine
    container_name: iwana_nginx_prod
    profiles:
      - production
    ports:
      - '${PROXY_HTTP_PORT:-80}:80'
      - '${PROXY_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets:/etc/nginx/secrets:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- https://127.0.0.1/ --no-check-certificate || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: iwana_adminer_dev
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  iwana_postgres_data_dev:
    name: iwana_postgres_data_dev
  iwana_redis_data_dev:
    name: iwana_redis_data_dev
  iwana_minio_data_dev:
    name: iwana_minio_data_dev
  iwana_typesense_data_dev:
    name: iwana_typesense_data_dev
